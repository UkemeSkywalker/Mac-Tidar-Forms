version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify env vars exist only at build time; write the server-side
        # ones to .env.production so API routes can read them at runtime.
        - env | grep -E '^(DATA_REGION|TABLE_NAME|SESSION_SECRET)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
